<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>To-Do List (Synced)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, Roboto, sans-serif;
      background: #f4f5f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #4a90d9;
      color: white;
      padding: 20px 16px 16px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #codeLabel {
      font-size: 13px;
      font-weight: normal;
      opacity: 0.9;
    }
    #inputRow {
      display: flex;
      padding: 12px;
      gap: 8px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
    }
    #taskInput {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #addBtn {
      padding: 12px 18px;
      font-size: 16px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 8px;
    }
    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      flex: 1;
    }
    #list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: white;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }
    #list li.done span { text-decoration: line-through; color: #999; }
    #list li span { flex: 1; word-break: break-word; }
    .checkbox {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid #4a90d9; flex-shrink: 0;
    }
    #list li.done .checkbox { background: #4a90d9; }
    .deleteBtn { color: #d9534f; font-size: 20px; padding: 0 6px; flex-shrink: 0; }
    #emptyMsg { text-align: center; color: #999; margin-top: 40px; font-size: 15px; }

    /* --- List code entry screen --- */
    #codeScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 14px;
    }
    #codeScreen p { color: #555; max-width: 320px; line-height: 1.4; }
    #codeInput {
      padding: 14px;
      font-size: 20px;
      text-align: center;
      letter-spacing: 2px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 200px;
    }
    #joinBtn {
      padding: 12px 24px;
      font-size: 16px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 8px;
    }
    .hidden { display: none !important; }
    #syncStatus {
      font-size: 12px;
      color: #999;
      text-align: center;
      padding: 6px;
    }
  </style>
</head>
<body>

  <!-- Screen 1: enter or create a list code -->
  <div id="codeScreen">
    <h2>My To-Do List</h2>
    <p>Enter a List Code. Use the <b>same code on every device</b> you want to share this list with.</p>
    <input id="codeInput" type="text" placeholder="e.g. FAMILY1" maxlength="12" />
    <button id="joinBtn">Open List</button>
  </div>

  <!-- Screen 2: the actual list (hidden until a code is entered) -->
  <div id="appScreen" class="hidden" style="display:none; flex-direction:column; height:100%;">
    <header>
      <span>My To-Do List</span>
      <span id="codeLabel"></span>
    </header>
    <div id="inputRow">
      <input id="taskInput" type="text" placeholder="Add a task..." />
      <button id="addBtn">Add</button>
    </div>
    <ul id="list"></ul>
    <div id="emptyMsg">No tasks yet — add one above.</div>
    <div id="syncStatus">Synced</div>
  </div>

  <!-- Firebase SDKs (compat version — simplest syntax) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    // 1) PASTE YOUR OWN FIREBASE CONFIG HERE (see README for how to get this)
    const firebaseConfig = {
      apiKey: "AIzaSyAHG-WweiGHBTUabxafNVqlmCmaRx3Pbns",
      authDomain: "my-to-do-app-c7827.firebaseapp.com",
      projectId: "my-to-do-app-c7827",
      storageBucket: "my-to-do-app-c7827.firebasestorage.app",
      messagingSenderId: "440271714346",
      appId: "1:440271714346:web:00ad919719db4386d3ab53"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- Elements ---
    const codeScreen = document.getElementById('codeScreen');
    const appScreen = document.getElementById('appScreen');
    const codeInput = document.getElementById('codeInput');
    const joinBtn = document.getElementById('joinBtn');
    const codeLabel = document.getElementById('codeLabel');
    const listEl = document.getElementById('list');
    const inputEl = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const emptyMsg = document.getElementById('emptyMsg');
    const syncStatus = document.getElementById('syncStatus');

    let tasks = [];
    let listRef = null;

    // Remember the last code used on this device so you don't retype it every time
    const savedCode = localStorage.getItem('todo-list-code');
    if (savedCode) {
      codeInput.value = savedCode;
      openList(savedCode);
    }

    joinBtn.addEventListener('click', () => {
      const code = codeInput.value.trim().toUpperCase();
      if (!code) return;
      localStorage.setItem('todo-list-code', code);
      openList(code);
    });

    function openList(code) {
      listRef = db.collection('todo-lists').doc(code);
      codeLabel.textContent = 'List: ' + code;

      codeScreen.style.display = 'none';
      appScreen.classList.remove('hidden');
      appScreen.style.display = 'flex';

      // Real-time listener: fires immediately with current data,
      // then again automatically whenever ANY device changes this list.
      listRef.onSnapshot((doc) => {
        syncStatus.textContent = 'Synced';
        tasks = (doc.exists && doc.data().tasks) ? doc.data().tasks : [];
        render();
      }, (error) => {
        syncStatus.textContent = 'Offline — changes will sync when reconnected';
      });
    }

    function saveTasks() {
      syncStatus.textContent = 'Syncing…';
      listRef.set({ tasks: tasks });
      // No need to call render() here — onSnapshot above fires automatically
      // after the write succeeds, and redraws the list for us.
    }

    function render() {
      listEl.innerHTML = '';
      emptyMsg.style.display = tasks.length === 0 ? 'block' : 'none';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');

        const checkbox = document.createElement('div');
        checkbox.className = 'checkbox';
        checkbox.onclick = () => {
          tasks[index].done = !tasks[index].done;
          saveTasks();
        };

        const span = document.createElement('span');
        span.textContent = task.text;

        const deleteBtn = document.createElement('div');
        deleteBtn.className = 'deleteBtn';
        deleteBtn.textContent = '✕';
        deleteBtn.onclick = () => {
          tasks.splice(index, 1);
          saveTasks();
        };

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);
        listEl.appendChild(li);
      });
    }

    function addTask() {
      const text = inputEl.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      inputEl.value = '';
      saveTasks();
    }

    addBtn.addEventListener('click', addTask);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });
  </script>
</body>
</html>
